name: Refresh SignalFi and deploy

on:
  schedule:
    # GitHub Actions uses UTC. Attempt a refresh every 6 hours.
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect public data without AI cost
        env:
          PYTHONUNBUFFERED: "1"
          HTTP_TIMEOUT: "20"
          MAX_EVENTS: "24"
        run: python scripts/collect.py --no-ai

      - name: Require a live data snapshot
        run: >-
          python -c "import json; d=json.load(open('data/latest.json', encoding='utf-8')); raise SystemExit(0 if d.get('mode') == 'live' else 'Collector produced demo data; keeping the previous Pages deployment')"

      - name: Build static site artifact
        run: |
          mkdir -p _site
          cp *.html _site/
          cp -r assets _site/
          cp -r data _site/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
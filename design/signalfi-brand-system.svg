    <text x="72" y="920" fill="#A0AEC0" font-size="8">导航 16–18px　指标卡片 20–24px　列表 16–18px　风险状态 14–16px</text>
    <text x="72" y="941" fill="#718096" font-size="8">统一描边、圆角、视觉重量；不混用 Emoji、3D 图标或其他图标库。</text>
    <text x="72" y="962" fill="#718096" font-size="8">交互图标必须有文字说明或无障碍标签；风险状态必须同时显示文字。</text>

    <rect x="968" y="774" width="584" height="218" rx="18" fill="#0D1220" stroke="#26334A"/>
    <text x="992" y="805" fill="#718096" font-size="9" letter-spacing=".8">USAGE RULES</text>
    <text x="992" y="834" fill="#F1F5F9" font-size="12" font-weight="600">颜色只表达含义，不表达装饰。</text>
    <text x="992" y="858" fill="#A0AEC0" font-size="8">01　蓝色作为主要品牌色和交互色；避免大面积饱和蓝背景。</text>
    <text x="992" y="880" fill="#A0AEC0" font-size="8">02　青色用于实时状态、图表高亮和数据刷新反馈。</text>
    <text x="992" y="902" fill="#A0AEC0" font-size="8">03　青绿色用于 Confirmed / Healthy；琥珀色用于 Unverified / Watch。</text>
    <text x="992" y="924" fill="#A0AEC0" font-size="8">04　红色只用于风险、警报和高危状态；紫色只用于 Prediction Research。</text>
    <text x="992" y="946" fill="#A0AEC0" font-size="8">05　状态不能只靠颜色：始终搭配文字、图标或形状。</text>
    <text x="992" y="968" fill="#A0AEC0" font-size="8">06　所有页面通过 CSS Variables 使用同一套 Token。</text>
